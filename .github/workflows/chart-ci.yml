name: Chart CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

# A new push to the same PR cancels the previous run. Runs on master are never
# cancelled: they may be in the middle of a chart release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  detect-chart-changes:
    name: detect-chart-changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      charts-changed: ${{ steps.check.outputs.charts-changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for chart changes
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_BRANCH"
            CHANGED_FILES=$(git diff --name-only "origin/$BASE_BRANCH"...HEAD)
          else
            CHANGED_FILES=$(git diff --name-only HEAD~1)
          fi

          CHART_DIRS=$(find . -name "Chart.yaml" -not -path "*/charts/*" -type f -exec dirname {} \; | sed 's|^\./||')

          CHART_CHANGED=false
          for file in $CHANGED_FILES; do
            for chart_dir in $CHART_DIRS; do
              if [[ "$file" == "$chart_dir"/* ]]; then
                CHART_CHANGED=true
                break 2
              fi
            done
          done

          echo "charts-changed=$CHART_CHANGED" >> "$GITHUB_OUTPUT"

  check-version-bump:
    name: check-version-bump
    needs: detect-chart-changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        if: needs.detect-chart-changes.outputs.charts-changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for version bumps
        if: needs.detect-chart-changes.outputs.charts-changed == 'true'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          set -e

          # Get the base branch
          echo "Base branch: $BASE_BRANCH"

          # Fetch the base branch
          git fetch origin "$BASE_BRANCH"

          # Find all top-level Chart.yaml files (exclude subcharts in charts/ subdirectories)
          # Only top-level charts are released, so we only check those
          CHART_FILES=$(find . -name "Chart.yaml" -not -path "*/charts/*" -type f | grep -v "/\.")

          echo "Checking Chart.yaml files for version bumps..."

          FAILED=0

          for CHART_FILE in $CHART_FILES; do
            echo "---"
            echo "Checking: $CHART_FILE"

            # Get current version
            CURRENT_VERSION=$(grep "^version:" "$CHART_FILE" | awk '{print $2}' | tr -d '"' | tr -d "'")
            echo "Current version: $CURRENT_VERSION"

            # Get base version (check if file exists in base branch)
            if git cat-file -e "origin/$BASE_BRANCH:$CHART_FILE" 2>/dev/null; then
              BASE_VERSION=$(git show "origin/$BASE_BRANCH:$CHART_FILE" | grep "^version:" | awk '{print $2}' | tr -d '"' | tr -d "'")
              echo "Base version: $BASE_VERSION"

              # Compare versions
              if [ "$CURRENT_VERSION" == "$BASE_VERSION" ]; then
                echo "ERROR: Version in $CHART_FILE has not been bumped!"
                echo "   Current: $CURRENT_VERSION"
                echo "   Base: $BASE_VERSION"
                echo "   Please increment the version in $CHART_FILE"
                FAILED=1
              else
                echo "Version bumped from $BASE_VERSION to $CURRENT_VERSION"
              fi
            else
              echo "New chart file (not in base branch), skipping version check"
            fi
          done

          echo "---"

          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "Version bump check FAILED"
            echo "One or more Chart.yaml files need version updates."
            echo "Please increment the version field according to semantic versioning."
            exit 1
          else
            echo "All Chart.yaml files have been properly versioned"
          fi

  # Publishes the chart to the Helm repository served by GitHub Pages
  # (https://charts.diracgrid.org). The site is deployed from this job, not from
  # a branch, and no tag or GitHub release is created: a workflow may do neither.
  release:
    name: release
    needs: detect-chart-changes
    if: github.event_name == 'push' && needs.detect-chart-changes.outputs.charts-changed == 'true'
    runs-on: ubuntu-latest
    # One publication at a time: each one starts from the site as the previous one left it.
    concurrency:
      group: chart-site
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://charts.diracgrid.org
    permissions:
      contents: read
      pages: write  # deploy the site to GitHub Pages
      id-token: write  # OIDC authentication for the Pages deployment
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the chart package and the repository index
        id: site
        run: .github/scripts/build_chart_site.sh diracx site

      - name: Upload the site
        if: steps.site.outputs.published == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.site.outputs.published == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
